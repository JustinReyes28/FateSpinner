<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add your choices, spin the wheel, and make a decision. A free, private random picker with saved lists and no downloads.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f3f6fb">
    <title>FateSpinner</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="spinner-core.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app-container">
        <header class="header">
            <a class="wordmark" href="./" aria-label="FateSpinner home"><span class="brand-mark" aria-hidden="true"></span>FateSpinner</a>
        </header>

        <div class="workspace">
            <section class="spinner-section" aria-labelledby="spinnerHeading">
                <h1 id="spinnerHeading" class="sr-only">Decision wheel</h1>
                <a id="editChoicesLink" class="mobile-edit-link" href="#wordInput">Add your choices <span aria-hidden="true">↓</span></a>
                <div class="wheel-outer" aria-hidden="true">
                    <div class="pointer"></div>
                    <div class="wheel-clip"><div id="wheel" class="wheel"></div></div>
                    <div class="wheel-center"><span id="wheelCenter">?</span></div>
                </div>
                <div class="action-container">
                    <button id="spinBtn" class="btn btn-primary" type="button" disabled>Spin the wheel <span aria-hidden="true">↗</span></button>
                    <p id="spinHint" class="spin-hint">Add 2 choices to spin.</p>
                    <p id="lastPick" class="last-pick" hidden></p>
                </div>
            </section>

            <section class="controls-section" aria-labelledby="choicesHeading">
                <div class="panel-heading">
                    <h2 id="choicesHeading">Your choices</h2>
                    <span id="itemCount" class="count-badge">0 entries</span>
                </div>
                <form id="choiceForm" novalidate>
                    <label for="wordInput">Add one or a few</label>
                    <p id="inputHint" class="field-hint">One choice per line. Up to 60 entries, 80 characters each.</p>
                    <textarea id="wordInput" rows="3" maxlength="5000" placeholder="Pizza&#10;Sushi&#10;Something new" aria-describedby="inputHint inputError" autocomplete="off" spellcheck="false"></textarea>
                    <p id="inputError" class="input-error" role="alert" hidden></p>
                    <div class="form-actions">
                        <span class="shortcut-hint">Ctrl / ⌘ + Enter to add</span>
                        <button id="addWordBtn" class="btn btn-secondary" type="submit">Add choices <span aria-hidden="true">+</span></button>
                    </div>
                </form>
                <div class="list-heading"><h3>On the wheel</h3><button id="resetBtn" class="btn btn-text" type="button" disabled>Clear all</button></div>
                <div id="emptyState" class="empty-state">
                    <span class="empty-wheel" aria-hidden="true"></span>
                    <button id="exampleBtn" class="btn btn-text" type="button">Try a lunch list <span aria-hidden="true">→</span></button>
                </div>
                <ol id="itemsList" class="items-list" aria-label="Choices on the wheel"></ol>
                <div class="list-footer">
                    <p id="saveNotice">Saved in this browser.</p>
                    <button id="undoBtn" class="btn btn-text" type="button" hidden>Undo clear</button>
                </div>
            </section>
        </div>
        <p id="statusMessage" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
        <noscript><p class="noscript-message">Enable JavaScript to add choices and spin the wheel.</p></noscript>
    </main>

    <dialog id="resultDialog" class="result-dialog" aria-labelledby="resultHeading winnerName" aria-describedby="resultDetail">
        <div class="result-content">
            <p class="result-label" id="resultHeading">Result</p>
            <h2 id="winnerName" class="winner-name"></h2>
            <p id="resultDetail" class="result-detail"></p>
            <button id="spinAgainBtn" class="btn btn-primary" type="button" autofocus>Spin again <span aria-hidden="true">↗</span></button>
            <button id="removeWinnerBtn" class="btn btn-secondary" type="button">Remove this winner</button>
            <button id="closeResult" class="btn btn-text" type="button">Done</button>
        </div>
    </dialog>
</body>
</html>
